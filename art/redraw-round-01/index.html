<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>乌萨奇 · 首轮三组重绘</title>
<style>
:root{color-scheme:light;--ink:#453629;--muted:#796e60;--line:#e7ddcb;--paper:#faf7ee;--accent:#8b562c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:38px 28px 50px}header{max-width:950px}small,.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent)}h1{font-size:34px;font-weight:650;letter-spacing:-.02em;margin:12px 0}header p{line-height:1.8;color:var(--muted);margin:8px 0}.note{padding:14px 18px;background:#fff3d5;border-left:3px solid #c98e3c;border-radius:3px;font-size:13px;line-height:1.8;margin:22px 0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0 18px}button,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{border-color:#ba9468;background:#fffaf0}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ca953b;outline-offset:3px}.toolbar button{background:var(--ink);color:white}.toolbar span{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{min-width:0;border:1px solid var(--line);background:#fff;border-radius:15px;overflow:hidden}.card-head{padding:23px 23px 0}.number{font-size:12px;color:#a1773f;letter-spacing:.13em}h2{font-size:20px;margin:9px 0 8px}.description{font-size:13px;line-height:1.75;color:var(--muted);min-height:46px;margin:0}.stage{padding:0 15px;background:white}canvas{display:block;width:100%;height:auto;max-width:400px;margin:0 auto;aspect-ratio:1}.controls{padding:0 23px 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.controls button,.controls select{font-size:12px;padding:7px 10px}.controls input{width:100%;accent-color:#91602e}.links{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;padding-top:7px}a{color:var(--accent);text-underline-offset:4px}.reference{border-top:1px solid var(--line);padding:15px 23px;font-size:13px}.reference summary{cursor:pointer;color:var(--muted)}.reference img{display:block;max-width:100%;max-height:270px;margin:18px auto 10px}.reference p{font-size:12px;line-height:1.6;color:var(--muted)}footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.8}#error{color:#8e231b;background:#ffebeb;padding:12px;border-radius:5px}[hidden]{display:none!important}@media(max-width:950px){.cards{grid-template-columns:1fr;max-width:600px;margin:auto}.description{min-height:0}main{padding:25px 18px}h1{font-size:28px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">USAGI · APPROVED DESIGN · V3</div><h1>已认可的乌萨奇形象</h1><p>固定正面、侧面与背面的短圆比例、嘴下短弧线和白色圆毛球尾巴。三组均依据你认可的原始动图重绘，v3 已获认可。</p></header>
<div class="note">本轮是 <strong>已认可的白底形象与姿态基准</strong>。播放用于查看姿态，尚未制作透明分层、Live2D 模型或最终平滑过渡。完整版已确定采用 Live2D，视线跟随会包含头部的细微摆动。</div>
<div class="toolbar"><button id="toggle-all" type="button">播放全部</button><span>可暂停逐帧查看 · 侧面与背面已修正白色毛球尾巴</span></div>
<p id="error" hidden></p><div id="cards" class="cards"></div>
<footer>形象参考：U001 跑摔弹起、U003 背身拍屁屁、U006 迎面跑。预览只对齐姿态位置，保留原稿比例，没有插帧。<br><a href="../../references/action-library/index.html">原始动作素材库</a> · <a href="../character-spec.md">角色规范</a> · <a href="README.md">本轮说明</a> · <a href="prompts.md">生成提示词</a></footer>
</main><script src="manifest.js"></script><script>
const app={players:[],ready:false};window.reviewApp=app;
const cards=document.getElementById('cards'),all=document.getElementById('toggle-all');
function updateAll(){all.textContent=app.players.some(p=>p.playing)?'暂停全部':'播放全部'}
function show(p){const ctx=p.canvas.getContext('2d'),f=p.data.frames[p.index];ctx.fillStyle='#ffffff';ctx.fillRect(0,0,512,512);ctx.drawImage(p.image,f.crop[0],f.crop[1],f.crop[2],f.crop[3],Math.round((512-f.crop[2])/2),480-f.crop[3],f.crop[2],f.crop[3]);p.slider.value=p.index;p.count.textContent=`${String(p.index+1).padStart(2,'0')} / ${p.data.frames.length} 帧`;p.button.textContent=p.playing?'暂停':'播放';p.canvas.dataset.frame=p.index;updateAll()}
function pause(p){p.playing=false;p.elapsed=0;show(p)}
for(const data of REDRAW_MANIFEST.groups){const card=document.createElement('article');card.className='card';card.dataset.group=data.id;card.innerHTML=`<div class="card-head"><div class="number">GROUP ${data.id}</div><h2>${data.title}</h2><p class="description">${data.review_focus}</p></div><div class="stage"><canvas width="512" height="512" aria-label="${data.title}姿态预览"></canvas></div><div class="controls"><div class="row"><button class="play" type="button">播放</button><span class="count"></span><select class="speed" aria-label="${data.title}播放速度"><option value="0.5">0.5× 慢放</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></div><input class="scrub" type="range" min="0" max="${data.frames.length-1}" value="0" step="1" aria-label="${data.title}逐帧查看"><div class="row"><button class="prev" type="button">上一帧</button><button class="next" type="button">下一帧</button></div><div class="links"><a href="${data.sheet}" target="_blank">查看整组原稿</a></div></div><details class="reference"><summary>对照原始动图 · ${data.source_ids.join(' / ')}</summary><img src="${data.source_media}" alt="${data.title}使用的原始动作参考"><p>${data.source_note}</p></details>`;cards.appendChild(card);
 const p={data,card,index:0,elapsed:0,playing:false,speed:1,image:new Image(),canvas:card.querySelector('canvas'),slider:card.querySelector('.scrub'),count:card.querySelector('.count'),button:card.querySelector('.play'),loaded:false};app.players.push(p);
 p.image.onload=()=>{p.loaded=true;show(p);app.ready=app.players.length===3&&app.players.every(x=>x.loaded)};p.image.onerror=()=>{const e=document.getElementById('error');e.hidden=false;e.textContent='有一组原稿未能加载，请保持本页与图片文件在同一目录。'};p.image.src=data.sheet;
 p.button.onclick=()=>{if(!p.loaded)return;p.playing=!p.playing;p.elapsed=0;show(p)};p.slider.oninput=()=>{p.index=Number(p.slider.value);pause(p)};card.querySelector('.prev').onclick=()=>{p.index=(p.index+data.frames.length-1)%data.frames.length;pause(p)};card.querySelector('.next').onclick=()=>{p.index=(p.index+1)%data.frames.length;pause(p)};card.querySelector('.speed').onchange=e=>{p.speed=Number(e.target.value);p.elapsed=0};
}
all.onclick=()=>{const shouldPlay=!app.players.some(p=>p.playing);for(const p of app.players){if(!p.loaded)continue;p.playing=shouldPlay;p.elapsed=0;show(p)}};
let last=0;function tick(t){const delta=last?Math.min(t-last,100):0;last=t;for(const p of app.players){if(!p.loaded||!p.playing)continue;p.elapsed+=delta*p.speed;if(p.elapsed>=p.data.frames[p.index].duration_ms){p.elapsed-=p.data.frames[p.index].duration_ms;p.index=(p.index+1)%p.data.frames.length;show(p)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{last=0});
</script></body></html>
